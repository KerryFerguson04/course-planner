spring.application.name=course-planner

# Course catalog loaded into memory at startup (read-only reference data)
planner.catalog=classpath:catalog.json

# Plans are stored in an embedded H2 database file under ./data
spring.datasource.url=jdbc:h2:file:./data/planner
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the tables at http://localhost:8080/h2-console (JDBC URL above, user "sa")
spring.h2.console.enabled=true

# Leave null fields (e.g. a search result's badge when no plan is given) out of JSON
spring.jackson.default-property-inclusion=non_null
